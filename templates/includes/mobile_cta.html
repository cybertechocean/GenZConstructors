<!-- Fixed Mobile Bottom CTA Bar -->
<div class="mobile-action-bar" role="navigation" aria-label="Quick Mobile Actions">
  <a href="tel:{{ company_phone_clean }}" class="flex-1 flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-[#08060A] border border-[#B98F3D]/30 text-[#F1EDDF] hover:text-[#EDDAA0] active:scale-95 transition-all text-center">
    <i data-lucide="phone-call" class="w-4 h-4 text-[#B98F3D] mb-0.5"></i>
    <span class="text-[11px] font-heading font-semibold uppercase tracking-wider">Call</span>
  </a>
  <a href="{{ whatsapp_default_url }}" target="_blank" rel="noopener noreferrer" class="flex-1 flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-[#128C7E] text-white active:scale-95 transition-all text-center shadow-sm">
    <i data-lucide="message-circle" class="w-4 h-4 mb-0.5"></i>
    <span class="text-[11px] font-heading font-semibold uppercase tracking-wider">WhatsApp</span>
  </a>
  <a href="{% url 'core:request_quote' %}" class="flex-1 flex flex-col items-center justify-center py-1.5 px-2 rounded-lg bg-gradient-to-r from-[#EDDAA0] to-[#B98F3D] text-[#010B20] active:scale-95 transition-all text-center shadow-sm">
    <i data-lucide="file-text" class="w-4 h-4 mb-0.5"></i>
    <span class="text-[11px] font-heading font-bold uppercase tracking-wider">Quote</span>
  </a>
</div>
