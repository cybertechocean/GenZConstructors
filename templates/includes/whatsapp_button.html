<!-- Floating Action Widgets (Phone Call & WhatsApp) -->
<div class="floating-actions-container">
  
  <!-- Floating Phone Call Button -->
  <a href="tel:{{ company_phone_clean }}" class="phone-floating-btn group" aria-label="Call Gen-Z Constructors at {{ company_phone_display }}">
    <div class="relative flex items-center justify-center">
      <i data-lucide="phone-call" class="w-4 h-4 text-[#B98F3D]"></i>
    </div>
    <span class="hidden sm:inline font-heading font-medium tracking-wide">Call Now</span>
  </a>

  <!-- Floating WhatsApp Action Widget -->
  <a href="{{ whatsapp_default_url }}" target="_blank" rel="noopener noreferrer" class="whatsapp-floating-btn group animate-pulse-subtle" aria-label="Chat with Gen-Z Constructors on WhatsApp">
    <div class="relative flex items-center justify-center">
      <i class="fa-brands fa-whatsapp text-lg"></i>
    </div>
    <span class="hidden sm:inline font-heading font-medium tracking-wide">WhatsApp Us</span>
  </a>

</div>
